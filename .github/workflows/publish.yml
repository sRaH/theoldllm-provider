name: Publish

# Pushing a `v*` tag publishes to both registries and attaches a built .zip to a
# GitHub Release. The tag must match `version` in package.json — the job fails
# otherwise rather than publishing a mislabelled package.
#
# npmjs.com uses npm Trusted Publishing (OIDC). There is no npm token anywhere in
# this workflow: npm CLI detects the OIDC environment and exchanges a short-lived
# publish credential for this exact workflow. Provenance is generated
# automatically by that path, so no --provenance flag is passed.
#
# The package is published under two different scopes, one per registry:
#   npmjs.com             @srah_x64/theoldllm-provider
#   GitHub Packages       @srah/theoldllm-provider
# The name is rewritten between the two publishes; nothing else differs.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Node 24 is required: trusted publishing needs npm CLI >= 11.5.1, and the
      # npm bundled with Node 22 is too old. Caching is deliberately off for
      # release builds.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check npm supports OIDC
        run: |
          node --version
          npm --version
          node -e '
            const [major, minor] = require("child_process").execSync("npm --version").toString().trim().split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 5)) {
              console.error(`::error::npm ${major}.${minor} is too old for trusted publishing; need >= 11.5.1`);
              process.exit(1);
            }
          '

      - run: npm ci

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match package.json version $version"
            exit 1
          fi
          echo "Releasing $version"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify plugin shape
        run: npm run verify

      # Packed before the GitHub Packages rename below, so the archive carries
      # the canonical npmjs name rather than the @srah one.
      - name: Build release archive
        run: |
          name="theoldllm-provider-${GITHUB_REF_NAME}.zip"
          zip -r "$name" dist package.json README.md LICENSE
          echo "ASSET=$name" >> "$GITHUB_ENV"

      # Authenticates by OIDC. No token is read from secrets or written to .npmrc.
      - name: Publish to npm
        run: npm publish --access public

      - name: Publish to GitHub Packages
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = "@srah/theoldllm-provider";
            pkg.publishConfig = { ...pkg.publishConfig, registry: "https://npm.pkg.github.com" };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          echo "//npm.pkg.github.com/:_authToken=${GH_TOKEN}" >> ~/.npmrc
          npm publish
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" "$ASSET" \
            --title "v${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
